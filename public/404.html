<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BunkerWatch</title>
    <script>
      // GitHub Pages serves this for any unknown path (e.g. a refresh on
      // /BUNKERWATCH/sts-analysis). Encode the path and bounce through
      // index.html, which decodes it back via the script in index.html —
      // the standard rafgraph/spa-github-pages redirect pattern.
      var segmentCount = 1
      var l = window.location
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
        "/?/" +
        l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
